name: CRLF Check

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]

jobs:
  build:
    name: CRLF Check
    if: forgejo.event.pull_request.draft == false
    runs-on: codeberg-small
    steps:
    - uses: actions/checkout@v4.2.2
    - name: Check for CRLF
      run: Tools/check_crlf.py
