name: Build & Test Debug

on:
  push:
    branches: [ master ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master ]

env:
  DOTNET_INSTALL_DIR: "./.dotnet"

jobs:
  build:
    if: forgejo.actor != 'shortcircuit-bot' && forgejo.event.pull_request.draft == false

    runs-on: codeberg-medium

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    # TODO: setup a similar system for forgejo
    # (once i figure out what this actually does because honestly i kind of don't)
    # - name: Pull engine updates
    #   uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: https://github.com/actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /p:WarningsAsErrors=nullable /m

    - name: Run Content.Tests
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0

    - name: Run Content.IntegrationTests
      shell: pwsh
      run: |
        $env:DOTNET_gcServer=1
        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed

  ci-success:
    name: Build & Test Debug
    needs:
      - build
    runs-on: codeberg-tiny
    steps:
      - name: CI succeeded
        run: exit 0
